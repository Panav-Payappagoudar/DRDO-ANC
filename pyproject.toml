[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drdo-anc"
version = "0.1.0"
description = "AI/ML-enabled adaptive noise cancellation for defence communication"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]